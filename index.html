<!DOCTYPE html>
<html lang="fr" data-theme="nocturne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon appli santé</title>

<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/base.css">

<!-- Client Supabase (authentification + base de données) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="screen-loading">Chargement…</div>

<div id="screen-auth" class="hidden">
  <div class="auth-card">
    <h1 id="auth-title">Connexion</h1>
    <p class="subtitle" id="auth-subtitle">Accède à tes données, synchronisées partout.</p>
    <div id="auth-message-area"></div>
    <form id="auth-form">
      <div class="field">
        <label for="auth-email">Email</label>
        <input type="email" id="auth-email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="auth-password">Mot de passe</label>
        <input type="password" id="auth-password" required autocomplete="current-password" minlength="6">
        <div style="text-align: right; margin-top: 6px;">
          <button type="button" class="btn-link" id="auth-forgot-btn" style="font-size: 0.8rem;">Mot de passe oublié ?</button>
        </div>
      </div>
      <button type="submit" class="btn-primary" id="auth-submit">Se connecter</button>
    </form>
    <p class="auth-switch">
      <span id="auth-switch-text">Pas encore de compte ?</span>
      <button class="btn-link" id="auth-switch-btn" type="button">Créer un compte</button>
    </p>
  </div>
</div>

<div id="screen-app" class="hidden">
  <header class="app-header">
    <h1>Tableau de bord</h1>
    <div style="display:flex; align-items:center; gap:12px;">
      <span class="user-email" id="user-email"></span>
      <button class="btn-ghost" id="btn-logout">Déconnexion</button>
    </div>
  </header>
  <main>
    <section class="panel">
      <h2>Apparence</h2>
      <div class="theme-grid" id="theme-grid"></div>
      <p class="sync-status" id="theme-sync-status"></p>
    </section>
    <section class="panel">
      <h2>Bienvenue</h2>
      <p>Les modules (nutrition, sport, poids, habitudes, recettes) arriveront ici au fur et à mesure.</p>
    </section>
  </main>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
