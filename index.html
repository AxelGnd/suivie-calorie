<!DOCTYPE html>
<html lang="fr" data-theme="nocturne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mon appli santé</title>

<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/nutrition.css">

<!-- Client Supabase (authentification + base de données) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="screen-loading">Chargement…</div>

<div id="screen-auth" class="hidden">
  <div class="auth-card">
    <h1 id="auth-title">Connexion</h1>
    <p class="subtitle" id="auth-subtitle">Accède à tes données, synchronisées partout.</p>
    <div id="auth-message-area"></div>
    <form id="auth-form">
      <div class="field">
        <label for="auth-email">Email</label>
        <input type="email" id="auth-email" required autocomplete="email">
      </div>
      <div class="field">
  <label for="auth-password">Mot de passe</label>
  <input type="password" id="auth-password" required autocomplete="current-password" minlength="6">
  <small style="display: block; color: var(--text-muted); font-size: 0.75rem; margin-top: 4px;">
    6 caractères min. avec majuscule, minuscule et chiffre.
  </small>
  <div style="text-align: right; margin-top: 6px;">
    <button type="button" class="btn-link" id="auth-forgot-btn" style="font-size: 0.8rem;">Mot de passe oublié ?</button>
  </div>
</div>
      <button type="submit" class="btn-primary" id="auth-submit">Se connecter</button>
    </form>
    <p class="auth-switch">
      <span id="auth-switch-text">Pas encore de compte ?</span>
      <button class="btn-link" id="auth-switch-btn" type="button">Créer un compte</button>
    </p>
  </div>
</div>

<div id="screen-app" class="hidden">
  <header class="app-header">
    <h1>Tableau de bord</h1>
    <div style="display:flex; align-items:center; gap:12px;">
      <span class="user-email" id="user-email"></span>
      <button class="btn-ghost" id="btn-logout">Déconnexion</button>
    </div>
  </header>
  <main>
    <section class="tab-panel" id="tab-nutrition">
      <div class="day-nav">
        <button class="btn-ghost" id="day-prev" aria-label="Jour précédent">‹</button>
        <div id="day-label"></div>
        <button class="btn-ghost" id="day-next" aria-label="Jour suivant">›</button>
      </div>
      <div class="panel summary">
        <strong id="kcal-left">–</strong>
        <div class="caption" id="kcal-caption"></div>
        <div class="bar"><div id="kcal-bar"></div></div>
        <div class="macros" id="macros"></div>
        <button class="btn-link" id="goal-edit">Modifier mon objectif</button>
      </div>
      <div id="meals"></div>
    </section>
    <section class="tab-panel hidden" id="tab-reglages">
      <section class="panel">
        <h2>Apparence</h2>
        <div class="theme-grid" id="theme-grid"></div>
        <p class="sync-status" id="theme-sync-status"></p>
      </section>
    </section>
  </main>
  <nav class="tabbar" aria-label="Sections">
    <button class="tab-btn" data-tab="nutrition" aria-selected="true">Nutrition</button>
    <button class="tab-btn" data-tab="reglages" aria-selected="false">Réglages</button>
  </nav>
  <dialog id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-head"><h2 id="sheet-title"></h2><button type="button" class="btn-ghost" id="sheet-close">Fermer</button></div>
    <div class="field"><label for="food-search">Chercher un aliment</label><input type="search" id="food-search" autocomplete="off"></div>
    <ul id="food-list"></ul>
    <div class="sheet-actions">
      <button type="button" class="btn-ghost" id="btn-create">Créer un aliment</button>
      <button type="button" class="btn-ghost" id="btn-scan">Scanner un aliment</button>
    </div>
    <form id="entry-form" class="hidden">
      <p><b id="picked-name"></b></p>
      <div class="field"><label for="qty">Quantité (g)</label><input type="number" id="qty" inputmode="decimal" min="1" step="any" required></div>
      <p id="qty-preview"></p>
      <button type="submit" class="btn-primary">Ajouter au journal</button>
    </form>
    <div id="scan-box" class="hidden">
      <video id="scan-video" playsinline muted></video>
      <p id="scan-msg" role="status"></p>
      <form id="scan-manual">
        <div class="field"><label for="scan-code">Ou tape le code-barres</label><input id="scan-code" inputmode="numeric" pattern="[0-9]{8,14}" autocomplete="off"></div>
        <button type="submit" class="btn-ghost">Chercher</button>
      </form>
      <button type="button" class="btn-link" id="scan-stop">Annuler le scan</button>
    </div>
    <form id="food-form" class="hidden">
      <div class="field"><label for="nf-name">Nom</label><input id="nf-name" maxlength="100" required></div>
      <div class="field"><label for="nf-kcal">Calories pour 100 g</label><input type="number" id="nf-kcal" inputmode="decimal" min="0" step="any" required></div>
      <div class="field"><label for="nf-p">Protéines pour 100 g</label><input type="number" id="nf-p" inputmode="decimal" min="0" step="any"></div>
      <div class="field"><label for="nf-c">Glucides pour 100 g</label><input type="number" id="nf-c" inputmode="decimal" min="0" step="any"></div>
      <div class="field"><label for="nf-f">Lipides pour 100 g</label><input type="number" id="nf-f" inputmode="decimal" min="0" step="any"></div>
      <button type="submit" class="btn-primary">Enregistrer l’aliment</button>
    </form>
    <p id="sheet-msg" role="alert"></p>
  </dialog>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
